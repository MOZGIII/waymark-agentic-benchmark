- name: Create the SSH directory of {{ prod_access_user }}
  ansible.builtin.file:
    path: "/home/{{ prod_access_user }}/.ssh"
    state: directory
    owner: "{{ prod_access_user }}"
    group: "{{ prod_access_user }}"
    mode: "0700"

- name: Install the key to production
  ansible.builtin.copy:
    src: "{{ prod_access_key_file }}"
    dest: "/home/{{ prod_access_user }}/.ssh/prod"
    owner: "{{ prod_access_user }}"
    group: "{{ prod_access_user }}"
    mode: "0600"

- name: Name production `prod` in the SSH config
  ansible.builtin.template:
    src: ssh_config.j2
    dest: "/home/{{ prod_access_user }}/.ssh/config"
    owner: "{{ prod_access_user }}"
    group: "{{ prod_access_user }}"
    mode: "0600"
